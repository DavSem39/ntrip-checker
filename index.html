<!doctype html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NTRIP Checker V2</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style;
}

.card-box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.status-online{
    background:#d1fae5;
    border-left:6px solid #22c55e;
}

.status-warning{
    background:#fff7ed;
    border-left:6px solid #f59e0b;
}

.status-offline{
    background:#fee2e2;
    border-left:6px solid #ef4444;
}

</style>

</head>

<body>

<div class="container py-4">

    <div class="card-box">

        <h2 class="mb-3">
            NTRIP Checker
        </h2>

        <input
            id="host"
            class="form-control mb-2"
            placeholder="Caster">

        <input
            id="port"
            class="form-control mb-2"
            placeholder="Port">

        <input
            id="username"
            class="form-control mb-2"
            placeholder="Username">

        <input
            id="password"
            type="password"
            class="form-control mb-3"
            placeholder="Password">

        <button
            class="btn btn-primary w-100 mb-3"
            onclick="getm()">

            Get Mountpoints

        </button>

        <select
            id="mp"
            class="form-select mb-3">

        </select>

        <button
            class="btn btn-success w-100 mb-2"
            onclick="testc()">

            Test Connection

        </button>

        <button
            class="btn btn-secondary w-100 mb-3"
            onclick="saveConnection()">

            Save Connection

        </button>

        <div class="mb-3">

            <label class="form-label">
                Saved Connections
            </label>

            <select
                id="savedConnections"
                class="form-select"
                onchange="loadConnection()">

            </select>

        </div>

        <button
            class="btn btn-danger w-100 mb-3"
            onclick="deleteConnection()">

            Delete Saved Connection

        </button>

        <div id="res"></div>

    </div>

</div>

<script>

function payload(){

    return {

        host:
            document.getElementById("host").value,

        port:
            document.getElementById("port").value,

        username:
            document.getElementById("username").value,

        password:
            document.getElementById("password").value

    };

}


async function getm(){

    let r = await fetch('/mountpoints', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify(payload())

    });

    let d = await r.json();

    let select =
        document.getElementById("mp");

    select.innerHTML = '';

    if(d.success){

        d.mountpoints.forEach(v=>{

            select.innerHTML +=
            `<option>${v}</option>`;

        });

    }else{

        alert(d.error);

    }

}


async function testc(){

    let p = payload();

    p.mountpoint =
        document.getElementById("mp").value;

    let r = await fetch('/test_connection',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify(p)

    });

    let d = await r.json();

    let result =
        document.getElementById("res");

    if(d.success){

        let cssClass =
            "status-online";

        if(d.status === "NO RTCM DATA"){

            cssClass =
                "status-warning";

        }

        result.innerHTML = `

        <div class="p-3 rounded ${cssClass}">

            <h5>${d.status}</h5>

            <div>
                <strong>Latency:</strong>
                ${d.latency_ms} ms
            </div>

            <div>
                <strong>Bytes Received:</strong>
                ${d.bytes_received}
            </div>

            <div>
                <strong>RTCM:</strong>
                ${d.rtcm_detected ? "YES" : "NO"}
            </div>

        </div>

        `;

    }else{

        result.innerHTML = `

        <div class="p-3 rounded status-offline">

            <h5>OFFLINE</h5>

            <div>

                ${d.error}

            </div>

        </div>

        `;

    }

}


/* SAVE CONNECTIONS */

function saveConnection(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    profiles.push({

        host:
            document.getElementById("host").value,

        port:
            document.getElementById("port").value,

        username:
            document.getElementById("username").value,

        password:
            document.getElementById("password").value

    });

    localStorage.setItem(

        "ntripProfiles",

        JSON.stringify(profiles)

    );

    populateProfiles();

}


function populateProfiles(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    let dropdown =
        document.getElementById(
            "savedConnections"
        );

    dropdown.innerHTML = "";

    profiles.forEach((p,i)=>{

        dropdown.innerHTML +=

        `<option value="${i}">
            ${p.host}
        </option>`;

    });

}


function loadConnection(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    let profile =
        profiles[
            document.getElementById(
                "savedConnections"
            ).value
        ];

    if(!profile)
        return;

    document.getElementById("host").value =
        profile.host;

    document.getElementById("port").value =
        profile.port;

    document.getElementById("username").value =
        profile.username;

    document.getElementById("password").value =
        profile.password;

}


function deleteConnection(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    let index =
        parseInt(
            document.getElementById(
                "savedConnections"
            ).value
        );

    if(isNaN(index))
        return;

    profiles.splice(index,1);

    localStorage.setItem(

        "ntripProfiles",

        JSON.stringify(profiles)

    );

    populateProfiles();

}


window.addEventListener(
    "load",
    populateProfiles
);

</script>

</body>
</html>
