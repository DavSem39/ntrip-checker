<!DOCTYPE html><html><head><title>NTRIP Checker</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'></head><body class='container mt-5'><h2>NTRIP Checker</h2><input id='host' class='form-control' placeholder='Caster'><input id='port' class='form-control mt-2' value='2101'><input id='username' class='form-control mt-2' placeholder='User'><input id='password' type='password' class='form-control mt-2' placeholder='Password'><button class='btn btn-primary mt-3' onclick='gm()'>Get Mountpoints</button><select id='mp' class='form-select mt-3'></select><script>async function gm(){let r=await fetch('/mountpoints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:host.value,port:port.value,username:username.value,password:password.value})});let d=await r.json();mp.innerHTML='';if(d.success){d.mountpoints.forEach(x=>mp.innerHTML+=`<option>${x}</option>`);}else alert(d.error);}</script></body></html>
