 <!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>NTRIP Checker</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{
    background:#eef3f8;
    margin:0;
    min-height:100vh;
    font-family:Segoe UI, Arial, sans-serif;
}

.container-main{
    max-width:550px;
    margin:auto;
    padding:15px;
}

.card-box{
    background:white;
    padding:20px;
    border-radius:25px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.app-header{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.back-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#003b64;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.app-title h2{
    margin:0;
    font-size:24px;
    font-weight:700;
}

.app-title small{
    color:#666;
}

.form-control,
.form-select{
    min-height:55px;
    border-radius:12px;
    margin-bottom:10px;
}

.btn{
    min-height:55px;
    border-radius:12px;
    font-weight:600;
}

.status-online{
    background:#d1fae5;
    border-left:6px solid #22c55e;
    color:#166534;
}

.status-warning{
    background:#fef3c7;
    border-left:6px solid #f59e0b;
    color:#92400e;
}

.status-offline{
    background:#fee2e2;
    border-left:6px solid #ef4444;
    color:#991b1b;
}

.status-box{
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.status-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.info-text{
    font-size:12px;
    color:#666;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container-main">

<div class="card-box">

<div class="app-header">

<button
class="back-btn"
onclick="window.location.href='https://eu.jotform.com/app/262351124966357'">

←

</button>

<div class="app-title">

<h2>NTRIP Checker</h2>

<small>Dravo Survey Tools</small>

</div>

</div>

<div class="info-text">

It takes approximately 5 seconds to validate the RTCM stream.

</div>

<input
id="host"
class="form-control"
placeholder="Caster">

<input
id="port"
type="number"
class="form-control"
placeholder="Port">

<input
id="username"
class="form-control"
placeholder="Username">

<input
id="password"
type="password"
class="form-control"
placeholder="Password">

<button
class="btn btn-primary w-100 mb-3"
onclick="getm()">

Load Mountpoints

</button>

<select
id="mp"
class="form-select mb-3">

<option value="">
Select Mountpoint
</option>

</select>

<button
class="btn btn-success w-100 mb-2"
onclick="testc()">

Check Connection

</button>

<button
class="btn btn-secondary w-100 mb-3"
onclick="saveConnection()">

Save Connection

</button>

<label class="form-label">
Saved Connections
</label>

<select
id="savedConnections"
class="form-select mb-3"
onchange="loadConnection()">
</select>

<button
class="btn btn-danger w-100 mb-3"
onclick="deleteConnection()">

Delete Saved Connection

</button>

<div id="res"></div>

</div>

</div>

<script>

function payload(){

    return {

        host: document.getElementById("host").value,
        port: document.getElementById("port").value,
        username: document.getElementById("username").value,
        password: document.getElementById("password").value

    };

}

async function getm(){

    try{

        let response = await fetch("/mountpoints",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(payload())

        });

        let data = await response.json();

        let select =
        document.getElementById("mp");

        select.innerHTML = "";

        if(data.success){

            data.mountpoints.forEach(function(mp){

                let option =
                document.createElement("option");

                option.value = mp;
                option.textContent = mp;

                select.appendChild(option);

            });

            if(data.mountpoints.length === 0){

                select.innerHTML =
                '<option>No mountpoints found</option>';

            }

        }else{

            alert(data.error);

        }

    }catch(err){

        alert("Error loading mountpoints:\n\n" + err);

    }

}

async function testc(){

    try{

        let p = payload();

        p.mountpoint =
        document.getElementById("mp").value;

        let response =
        await fetch("/test_connection",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(p)

        });

        let data =
        await response.json();

        let result =
        document.getElementById("res");

        if(data.success){

            let cssClass =
            "status-online";

            let title =
            "🟢 ONLINE";

            if(data.status === "NO RTCM DATA"){

                cssClass =
                "status-warning";

                title =
                "🟡 NO RTCM DATA";

            }

            result.innerHTML = `

            <div class="status-box ${cssClass}">

                <div class="status-title">
                    ${title}
                </div>

                <div>
                    <strong>Latency:</strong>
                    ${data.latency_ms} ms
                </div>

                <div>
                    <strong>Bytes:</strong>
                    ${data.bytes_received}
                </div>

                <div>
                    <strong>RTCM:</strong>
                    ${data.rtcm_detected ? "YES" : "NO"}
                </div>

            </div>

            `;

        }else{

            result.innerHTML = `

            <div class="status-box status-offline">

                <div class="status-title">
                    🔴 OFFLINE
                </div>

                <div>
                    ${data.error}
                </div>

            </div>

            `;

        }

    }catch(err){

        alert(err);

    }

}

function saveConnection(){

    let profiles =
    JSON.parse(
        localStorage.getItem("ntripProfiles")
        || "[]"
    );

    profiles.push({

        host: document.getElementById("host").value,
        port: document.getElementById("port").value,
        username: document.getElementById("username").value,
        password: document.getElementById("password").value

    });

    localStorage.setItem(
        "ntripProfiles",
        JSON.stringify(profiles)
    );

    populateProfiles();

    alert("Connection saved.");

}

function populateProfiles(){

    let profiles =
    JSON.parse(
        localStorage.getItem("ntripProfiles")
        || "[]"
    );

    let dropdown =
    document.getElementById("savedConnections");

    dropdown.innerHTML =
    '<option value="">Select saved connection</option>';

    profiles.forEach(function(profile,index){

        dropdown.innerHTML +=

        `<option value="${index}">
            ${profile.host}
        </option>`;

    });

}

function loadConnection(){

    let profiles =
    JSON.parse(
        localStorage.getItem("ntripProfiles")
        || "[]"
    );

    let index =
    document.getElementById(
        "savedConnections"
    ).value;

    if(index === "")
        return;

    let profile =
    profiles[index];

    if(!profile)
        return;

    document.getElementById("host").value =
    profile.host;

    document.getElementById("port").value =
    profile.port;

    document.getElementById("username").value =
    profile.username;

    document.getElementById("password").value =
    profile.password;

}

function deleteConnection(){

    let profiles =
    JSON.parse(
        localStorage.getItem("ntripProfiles")
        || "[]"
    );

    let index =
    parseInt(
        document.getElementById(
            "savedConnections"
        ).value
    );

    if(isNaN(index))
        return;

    profiles.splice(index,1);

    localStorage.setItem(
        "ntripProfiles",
        JSON.stringify(profiles)
    );

    populateProfiles();

    alert("Connection deleted.");

}

window.onload = function(){

    populateProfiles();

};

</script>

</body>
</html>
