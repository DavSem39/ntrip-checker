<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NTRIP Checker</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>

body{
    background:#f5f7fa;
}

.card-box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.status-online{
    background:#d1fae5;
    border-left:6px solid #22c55e;
    color:#166534;
}

.status-warning{
    background:#fef3c7;
    border-left:6px solid #f59e0b;
    color:#92400e;
}

.status-offline{
    background:#fee2e2;
    border-left:6px solid #ef4444;
    color:#991b1b;
}

.status-box{
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.status-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container py-4">

    <div class="card-box">

        <h2 class="mb-3">
            NTRIP Checker
        </h2>

        <input
            id="host"
            class="form-control mb-2"
            placeholder="Caster">

        <input
            id="port"
            type="number"
            class="form-control mb-2"
            placeholder="Port">

        <input
            id="username"
            class="form-control mb-2"
            placeholder="Username">

        <input
            id="password"
            type="password"
            class="form-control mb-3"
            placeholder="Password">

        <button
            class="btn btn-primary w-100 mb-3"
            onclick="getm()">

            Get Mountpoints

        </button>

        <select
            id="mp"
            class="form-select mb-3">

        </select>

        <button
            class="btn btn-success w-100 mb-2"
            onclick="testc()">

            Test Connection

        </button>

        <button
            class="btn btn-secondary w-100 mb-3"
            onclick="saveConnection()">

            Save Connection

        </button>

        <label class="form-label">
            Saved Connections
        </label>

        <select
            id="savedConnections"
            class="form-select mb-3"
            onchange="loadConnection()">

        </select>

        <button
            class="btn btn-danger w-100 mb-3"
            onclick="deleteConnection()">

            Delete Saved Connection

        </button>

        <div id="res"></div>

    </div>

</div>

<script>

function payload(){

    return {

        host:
            document.getElementById("host").value,

        port:
            document.getElementById("port").value,

        username:
            document.getElementById("username").value,

        password:
            document.getElementById("password").value

    };

}

async function getm(){

    let response = await fetch('/mountpoints',{

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify(payload())

    });

    let data = await response.json();

    let select =
        document.getElementById("mp");

    select.innerHTML = "";

    if(data.success){

        data.mountpoints.forEach(function(mp){

            let option =
                document.createElement("option");

            option.value = mp;
            option.text = mp;

            select.appendChild(option);

        });

    }else{

        alert(data.error);

    }

}

async function testc(){

    let p = payload();

    p.mountpoint =
        document.getElementById("mp").value;

    let response =
        await fetch('/test_connection',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify(p)

        });

    let data =
        await response.json();

    let result =
        document.getElementById("res");

    if(data.success){

        let cssClass =
            "status-online";

        let title =
            "🟢 ONLINE";

        if(data.status === "NO RTCM DATA"){

            cssClass =
                "status-warning";

            title =
                "🟡 NO RTCM DATA";

        }

        result.innerHTML = `

        <div class="status-box ${cssClass}">

            <div class="status-title">

                ${title}

            </div>

            <div>

                <strong>Latency:</strong>
                ${data.latency_ms} ms

            </div>

            <div>

                <strong>Bytes Received:</strong>
                ${data.bytes_received}

            </div>

            <div>

                <strong>RTCM:</strong>
                ${data.rtcm_detected ? "YES" : "NO"}

            </div>

        </div>

        `;

    }else{

        result.innerHTML = `

        <div class="status-box status-offline">

            <div class="status-title">

                🔴 OFFLINE

            </div>

            <div>

                ${data.error}

            </div>

        </div>

        `;

    }

}

function saveConnection(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    profiles.push({

        host:
            document.getElementById("host").value,

        port:
            document.getElementById("port").value,

        username:
            document.getElementById("username").value,

        password:
            document.getElementById("password").value

    });

    localStorage.setItem(

        "ntripProfiles",

        JSON.stringify(profiles)

    );

    populateProfiles();

    alert("Connection saved.");

}

function populateProfiles(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    let dropdown =
        document.getElementById(
            "savedConnections"
        );

    dropdown.innerHTML =
        '<option value="">Select saved connection</option>';

    profiles.forEach(function(profile,index){

        dropdown.innerHTML +=

        `<option value="${index}">
            ${profile.host}
        </option>`;

    });

}

function loadConnection(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    let index =
        document.getElementById(
            "savedConnections"
        ).value;

    if(index === "")
        return;

    let profile =
        profiles[index];

    if(!profile)
        return;

    document.getElementById("host").value =
        profile.host;

    document.getElementById("port").value =
        profile.port;

    document.getElementById("username").value =
        profile.username;

    document.getElementById("password").value =
        profile.password;

}

function deleteConnection(){

    let profiles =
        JSON.parse(
            localStorage.getItem(
                "ntripProfiles"
            ) || "[]"
        );

    let index =
        parseInt(
            document.getElementById(
                "savedConnections"
            ).value
        );

    if(isNaN(index))
        return;

    profiles.splice(index,1);

    localStorage.setItem(

        "ntripProfiles",

        JSON.stringify(profiles)

    );

    populateProfiles();

    alert("Connection deleted.");

}

window.onload = function(){

    populateProfiles();

};

</script>

</body>
</html>
