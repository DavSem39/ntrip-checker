<!doctype html><html><head><title>NTRIP Checker V2</title><link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'></head><body class='container py-4'><h1>NTRIP Checker V2</h1><input id='host' class='form-control mb-2' placeholder='Caster'><input id='port' class='form-control mb-2' value='2101'><input id='username' class='form-control mb-2' placeholder='Username'><input id='password' type='password' class='form-control mb-2' placeholder='Password'><button class='btn btn-primary' onclick='getm()'>Get Mountpoints</button><select id='mp' class='form-select my-3'></select><button class='btn btn-success' onclick='testc()'>Test Connection</button><div id='res' class='mt-3'></div><script>
function payload(){return {host:host.value,port:port.value,username:username.value,password:password.value}}
async function getm(){let r=await fetch('/mountpoints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});let d=await r.json();mp.innerHTML='';if(d.success)d.mountpoints.forEach(v=>mp.innerHTML+=`<option>${v}</option>`);else alert(d.error)}
async function testc(){let p=payload();p.mountpoint=mp.value;let r=await fetch('/test_connection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let d=await r.json();res.innerHTML=d.success?`<div class="alert alert-success">Status:${d.status}<br>Latency:${d.latency_ms} ms<br>Bytes:${d.bytes_received}</div>`:`<div class="alert alert-danger">${d.error}</div>`}
</script></body></html>
