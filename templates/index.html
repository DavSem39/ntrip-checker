<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DRAVO NTRIP Checker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"dy{
    background:#dce7f3;
    margin:0;
    font-family:Segoe UI,Tahoma,sans-serif;
}

.hero{
    height:220px;
    background:linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.35)
    ),
    url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=1800");
    background-size:cover;
    background-position:center;
    position:relative;
}

.logo{
    width:90px;
    height:90px;
    background:#fff;
    border-radius:20px;
    position:absolute;
    bottom:-45px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.hero-title{
    position:absolute;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:#fff;
}

.hero-title h1{
    margin:0;
    font-size:40px;
    font-weight:700;
}

.hero-title p{
    margin:0;
    font-size:18px;
}

.container-main{
    max-width:700px;
    margin:auto;
    padding:70px 15px 20px;
}

.main-card{
    background:#fff;
    border-radius:25px;
    padding:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.title{
    font-size:30px;
    font-weight:700;
}

.subtitle{
    color:#666;
    margin-bottom:20px;
}

.input-card{
    border:1px solid #dde4ed;
    border-radius:18px;
    padding:12px;
    margin-bottom:12px;
    background:#fff;
}

.input-card label{
    font-size:14px;
    color:#666;
    margin-bottom:4px;
    display:block;
}

.form-control,
.form-select{
    border:none !important;
    box-shadow:none !important;
}

.btn-main{
    width:100%;
    height:55px;
    border:none;
    border-radius:15px;
    color:#fff;
    background:#7b61ff;
    font-weight:600;
    margin-bottom:12px;
}

.btn-test{
    width:100%;
    height:55px;
    border:none;
    border-radius:15px;
    color:#fff;
    background:#0d6efd;
    font-weight:600;
}

.status-card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-top:15px;
    border:1px solid #e6e6e6;
}

.status-header{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:700;
}

.dot{
    width:16px;
    height:16px;
    border-radius:50%;
}

.green{
    background:#2ecc71;
    box-shadow:0 0 8px #2ecc71;
}

.orange{
    background:#f39c12;
    box-shadow:0 0 8px #f39c12;
}

.red{
    background:#e74c3c;
    box-shadow:0 0 8px #e74c3c;
}

.metrics{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.metric{
    flex:1;
    background:#f6f8fb;
    border-radius:16px;
    padding:15px;
    text-align:center;
}

.metric-value{
    font-size:24px;
    font-weight:700;
    color:#0d47a1;
}

.metric-label{
    font-size:12px;
    color:#666;
}

.footer{
    text-align:center;
    color:#777;
    margin-top:15px;
}

@media(max-width:768px){

    .hero{
        height:180px;
    }

    .hero-title h1{
        font-size:28px;
    }

    .hero-title p{
        font-size:14px;
    }

    .logo{
        width:75px;
        height:75px;
        font-size:34px;
    }

    .metrics{
        flex-direction:column;
    }

    .title{
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="hero">

    <div class="hero-title">
        <h1>DRAVO</h1>
        <p>NTRIP Connectivity Checker</p>
    </div>

    <div class="logo">
        ⚓
    </div>

</div>

<div class="container-main">

    <div class="main-card">

        <div class="title">NTRIP Checker</div>

        <div class="subtitle">
            Test caster connectivity and mountpoints
        </div>

        <div class="input-card">
            <label>Caster</label>
            <input id="host" class="form-control" placeholder="ntrip.provider.com">
        </div>

        <div class="input-card">
            <label>Port</label>
            <input id="port" class="form-control" value="2101">
        </div>

        <div class="input-card">
            <label>Username</label>
            <input id="username" class="form-control">
        </div>

        <div class="input-card">
            <label>Password</label>
            <input id="password" type="password" class="form-control">
        </div>

        <button class="btn-main" onclick="getm()">
            Get Mountpoints
        </button>

        <div class="input-card">
            <label>Mountpoint</label>
            <select id="mp" class="form-select"></select>
        </div>

        <button class="btn-test" onclick="testc()">
            Test Connection
        </button>

        <div id="res"></div>

    </div>

    <div class="footer">
        Powered by Dravo Survey Tools
    </div>

</div>

<script>

function payload(){

    return{
        host:document.getElementById("host").value,
        port:document.getElementById("port").value,
        username:document.getElementById("username").value,
        password:document.getElementById("password").value
    };

}

async function getm(){

    let response = await fetch('/mountpoints', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify(payload())

    });

    let data = await response.json();

    let select = document.getElementById("mp");

    select.innerHTML = '';

    if(data.success){

        data.mountpoints.forEach(function(mp){

            select.innerHTML +=
            `<option>${mp}</option>`;

        });

    }else{

        alert(data.error);

    }

}

async function testc(){

    let p = payload();

    p.mountpoint =
    document.getElementById("mp").value;

    let response = await fetch('/test_connection', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify(p)

    });

    let data = await response.json();

    let result =
    document.getElementById("res");

    if(data.success){

        let dotClass = "green";
        let title = "ONLINE";

        if(data.status === "NO DATA"){

            dotClass = "orange";
            title = "NO DATA";

        }

        result.innerHTML = `

        <div class="status-card">

            <div class="status-header">

                <div class="dot ${dotClass}"></div>

                ${title}

            </div>

            <div class="metrics">

                <div class="metric">

                    <div class="metric-value">
                        ${data.latency_ms}
                    </div>

                    <div class="metric-label">
                        Latency (ms)
                    </div>

                </div>

                <div class="metric">

                    <div class="metric-value">
                        ${data.bytes_received}
                    </div>

                    <div class="metric-label">
                        Bytes Received
                    </div>

                </div>

            </div>

        </div>

        `;

    }else{

        result.innerHTML = `

        <div class="status-card">

            <div class="status-header">

                <div class="dot red"></div>

                OFFLINE

            </div>

            <div style="margin-top:15px">
                ${data.error}
            </div>

        </div>

        `;

    }

}

</script>

</body>
</html>
